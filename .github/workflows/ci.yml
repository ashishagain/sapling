name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: sapling_core (unit tests + sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S sapling_core -B build -DCMAKE_BUILD_TYPE=Debug -DSAPLING_SANITIZE=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  ros2:
    name: ROS 2 Jazzy colcon build
    runs-on: ubuntu-24.04
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/sapling
      - name: Install dependencies
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --cmake-args -DSAPLING_BUILD_TESTS=OFF
